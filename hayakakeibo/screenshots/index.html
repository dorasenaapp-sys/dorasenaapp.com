<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はや家計簿 スクリーンショット | Dorasena App</title>
  <meta name="description" content="はや家計簿のApp Store提出用スクリーンショット確認ページです。">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #0a84ff;
      --muted: color-mix(in srgb, CanvasText 64%, transparent);
      --line: color-mix(in srgb, CanvasText 14%, transparent);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.75;
    }
    body {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 64px;
      color: CanvasText;
      background: Canvas;
    }
    nav {
      margin-bottom: 1.5rem;
    }
    h1, h2 {
      line-height: 1.3;
    }
    h1 {
      font-size: 2.2rem;
      margin: 0 0 0.4rem;
    }
    @media (max-width: 560px) {
      h1 {
        font-size: 1.8rem;
      }
    }
    h2 {
      font-size: 1.25rem;
      margin-top: 2.2rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--line);
    }
    p {
      margin: 0.75rem 0;
    }
    a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }
    .updated,
    .note {
      color: var(--muted);
    }
    .contact-sheet {
      display: block;
      width: min(100%, 980px);
      height: auto;
      margin: 1rem 0 0;
      border: 1px solid var(--line);
    }
    .screens {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 1rem;
    }
    figure {
      margin: 0;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
    }
    figcaption {
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <nav><a href="/">Dorasena App</a> / はや家計簿</nav>
  <main>
    <h1>はや家計簿 スクリーンショット</h1>
    <p class="updated">最終更新: 2026-06-28 / v1.3.0提出候補</p>
    <p>iPhone Simulatorで撮影した実画面を元に、App Store提出用の <code>1320 x 2868</code> PNGとして作成しています。画像を開くと1枚ずつ原寸で確認できます。</p>
    <p class="note">2枚目は前回版と同じく、金額は固定したまま下の操作エリアだけが動くスワイプ途中の表現にしています。</p>

    <h2>提出画像</h2>
    <p class="note">1320 x 2868 PNG / 5枚</p>
    <div class="screens">
      <figure>
        <a href="assets/iphone-6-9/01_input.png"><img src="assets/iphone-6-9/01_input.png" alt="支出を、すぐ記録。金額を打って、選んで、保存"></a>
        <figcaption>1. 支出を、すぐ記録</figcaption>
      </figure>
      <figure>
        <a href="assets/iphone-6-9/02_category.png"><img src="assets/iphone-6-9/02_category.png" alt="スワイプでカテゴリへ。金額はそのまま、下だけ動く" loading="lazy"></a>
        <figcaption>2. スワイプでカテゴリへ</figcaption>
      </figure>
      <figure>
        <a href="assets/iphone-6-9/03_chart.png"><img src="assets/iphone-6-9/03_chart.png" alt="今月の支出が見える。グラフ・カレンダー・一覧で" loading="lazy"></a>
        <figcaption>3. 今月の支出が見える</figcaption>
      </figure>
      <figure>
        <a href="assets/iphone-6-9/04_calendar.png"><img src="assets/iphone-6-9/04_calendar.png" alt="日ごとにふり返る。カレンダーで使った日を確認" loading="lazy"></a>
        <figcaption>4. 日ごとにふり返る</figcaption>
      </figure>
      <figure>
        <a href="assets/iphone-6-9/05_list.png"><img src="assets/iphone-6-9/05_list.png" alt="履歴一覧から今日にコピー。記録を長押しして、同じ内容を追加" loading="lazy"></a>
        <figcaption>5. 履歴一覧から今日にコピー</figcaption>
      </figure>
    </div>

    <h2>提出メモ</h2>
    <p>画像はすべて架空データです。実広告、テスト広告、第三者ロゴ、旧名称、競合名は含めていません。</p>
  </main>
</body>
</html>
